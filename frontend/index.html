<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TV Supply Chain Damage Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <h1>TV Supply Chain Damage Tracker</h1>
        <p>Blockchain-based accountability system</p>
    </header>

    <main class="container">

        <!-- ================= SCAN TV ================= -->
        <section class="card">
            <h2>Scan a TV</h2>

            <label>TV ID</label>
            <input type="text" id="tvId" placeholder="TV-SAMSUNG-001">

            <label>Location</label>
            <select id="location">
                <option value="Factory">Factory</option>
                <option value="Truck">Truck</option>
                <option value="Warehouse">Warehouse</option>
            </select>

            <label>Handler</label>
            <select id="handler">
                <option value="Factory Manager">Factory Manager</option>
                <option value="Truck Driver">Truck Driver</option>
                <option value="Warehouse Manager">Warehouse Manager</option>
            </select>

            <label>Condition</label>
            <select id="condition">
                <option value="OK">OK</option>
                <option value="DAMAGED">DAMAGED</option>
            </select>

            <label>Private Key</label>
            <textarea id="privateKey" placeholder="Paste private key here"></textarea>

            <label>Public Key</label>
            <textarea id="publicKey" placeholder="Paste public key here"></textarea>

            <button id="scanBtn">Scan & Sign Transaction</button>

            <p id="scanMessage"></p>
        </section>

        <!-- ================= BLOCKCHAIN VIEWER ================= -->
        <section class="card">
            <h2>Blockchain Viewer</h2>
            <button id="loadChainBtn">Load Blockchain</button>
            <div id="blockchain"></div>
        </section>

        <!-- ================= BLAME DETECTION ================= -->
        <section class="card">
            <h2>Blame Detection</h2>

            <label>TV ID</label>
            <input type="text" id="blameTvId" placeholder="TV-SAMSUNG-001">

            <button id="detectBlameBtn">Detect Responsibility</button>

            <p id="blameResult"></p>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
